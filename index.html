<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cybersecurity Use Cases & Playbooks Portal</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

:root{
    --aws-orange:#ff9900;
    --aws-blue:#1f73b7;
    --bg:#16191f;
    --card:#232f3e;
    --border:#3b4552;
    --text:#ffffff;
    --muted:#b5bec8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;
}

header{
    background:
        linear-gradient(
            135deg,
            #0f1419,
            #1a2431,
            #232f3e
        );

    padding:80px 30px;
    text-align:center;
    border-bottom:1px solid var(--border);
}

header h1{
    font-size:3rem;
    margin-bottom:15px;
}

header p{
    max-width:1000px;
    margin:auto;
    color:var(--muted);
    line-height:1.7;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:30px;
}

.filters{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

input,
select{
    background:var(--card);
    color:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
}

#search{
    flex:1;
    min-width:350px;
}

#sectionFilter{
    min-width:280px;
}

button{
    background:var(--aws-orange);
    color:black;
    border:none;
    border-radius:10px;
    padding:14px 20px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.stats{
    color:var(--muted);
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(360px,1fr)
        );

    gap:20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:var(--aws-orange);
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:15px;
}

.badge{
    background:#101418;
    color:var(--aws-orange);
    font-size:.75rem;
    padding:5px 10px;
    border-radius:20px;
}

.card h3{
    line-height:1.5;
    margin-bottom:12px;
}

.path{
    color:var(--muted);
    font-size:.8rem;
    word-break:break-word;
}

.open-btn{
    margin-top:16px;
}

.loading{
    text-align:center;
    padding:50px;
    color:var(--aws-orange);
}

.error{
    color:#ff6b6b;
    text-align:center;
    padding:30px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    z-index:99999;
}

.modal-content{
    position:relative;
    width:95%;
    max-width:1500px;
    height:92vh;
    margin:2vh auto;
    background:#232f3e;
    border-radius:12px;
    overflow:auto;
    padding:30px;
}

.close{
    position:absolute;
    top:15px;
    right:25px;
    font-size:40px;
    cursor:pointer;
}

#playbookTitle{
    color:var(--aws-orange);
    margin-bottom:20px;
}

#playbookBody{
    line-height:1.8;
}

#playbookBody h1,
#playbookBody h2,
#playbookBody h3,
#playbookBody h4{
    color:var(--aws-orange);
    margin-top:25px;
    margin-bottom:10px;
}

#playbookBody table{
    width:100%;
    border-collapse:collapse;
    margin:20px 0;
}

#playbookBody th,
#playbookBody td{
    border:1px solid var(--border);
    padding:10px;
}

#playbookBody pre{
    background:#101418;
    padding:15px;
    border-radius:8px;
    overflow:auto;
}

#playbookBody code{
    background:#101418;
    padding:2px 4px;
    border-radius:4px;
}

#playbookBody a{
    color:#6cbcff;
}

footer{
    text-align:center;
    color:var(--muted);
    padding:25px;
    border-top:1px solid var(--border);
    margin-top:50px;
}

@media(max-width:768px){

    header h1{
        font-size:2rem;
    }

    .filters{
        flex-direction:column;
    }

    #search,
    #sectionFilter{
        width:100%;
        min-width:unset;
    }

    .grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<header>

<h1>Cybersecurity Use Cases & Playbooks</h1>

<p>
Centralized portal for threat detection, investigations,
incident response procedures, threat hunting playbooks,
digital forensics and cybersecurity operational guides.
</p>

</header>

<div class="container">

<div class="filters">

    <input
        id="search"
        type="text"
        placeholder="aws, windows, linux...">

    <button id="clearFilters">
        Clear Filters
    </button>

</div>

<div id="stats" class="stats">
    Loading repository...
</div>

<div id="cards" class="grid"></div>

</div>

<div id="modal" class="modal">

<div class="modal-content">

<span id="closeModal" class="close">&times;</span>

<h2 id="playbookTitle"></h2>

<div id="playbookBody"></div>

</div>

</div>

<footer>
Cybersecurity Use Cases & Playbooks Portal
</footer>

<script>

const OWNER = "aguztynbassi";
const REPO = "Cybersecurity-Use-Cases-Playbooks";

let DEFAULT_BRANCH = "main";
let documents = [];
const cache = {};

async function getDefaultBranch() {

    const response = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}`
    );

    if (!response.ok) {
        throw new Error("Repository not accessible");
    }

    const repo = await response.json();

    DEFAULT_BRANCH = repo.default_branch;
}

async function loadRepository() {

    try {

        document.getElementById("stats").textContent =
            "Loading repository...";

        await getDefaultBranch();

        const response = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${DEFAULT_BRANCH}?recursive=1`
        );

        if (!response.ok) {
            throw new Error("Tree API failed");
        }

        const data = await response.json();

        documents = data.tree
            .filter(file => file.type === "blob")
            .filter(file => file.path.endsWith(".md"))
            .filter(file => !file.path.toLowerCase().includes("readme"))
            .map(file => {

                const parts = file.path.split("/");

                return {

                    path:file.path,

                    title:parts[parts.length - 1]
                        .replace(".md","")
                        .replaceAll("_"," ")
                        .replaceAll("-"," "),

                    section:
                        parts.length > 0
                        ? parts[0]
                        : "General"

                };

            });

        documents.sort((a,b) =>
            a.title.localeCompare(b.title)
        );

        // buildFilters();

        render();

    } catch(error) {

        console.error(error);

        document.getElementById("stats").innerHTML =
            '<div class="error">Unable to load repository.</div>';
    }
}

function render() {

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    const filtered =
        documents.filter(item => {

            return (
                item.title
                    .toLowerCase()
                    .includes(query)

                ||

                item.path
                    .toLowerCase()
                    .includes(query)

                ||

                item.section
                    .toLowerCase()
                    .includes(query)
            );

        });

    document.getElementById("stats").innerHTML =
        `${filtered.length} playbooks indexed`;

    document.getElementById("cards").innerHTML =
        filtered.map(item => `

        <div class="card">

            <div class="badges">

                <span class="badge">
                    ${item.section}
                </span>

            </div>

            <h3>${item.title}</h3>

            <div class="path">
                ${item.path}
            </div>

            <button
                class="open-btn"
                onclick="openDocument('${item.path}')">
                Open Playbook
            </button>

        </div>

        `).join("");
}

async function openDocument(path) {

    document.getElementById("modal").style.display =
        "block";

    document.getElementById("playbookTitle")
        .textContent =
        path.split("/").pop();

    document.getElementById("playbookBody").innerHTML =
        '<div class="loading">Loading document...</div>';

    try {

        let markdown;

        if(cache[path]){

            markdown = cache[path];

        } else {

            const response = await fetch(
                `https://raw.githubusercontent.com/${OWNER}/${REPO}/${DEFAULT_BRANCH}/${path}`
            );

            markdown = await response.text();

            cache[path] = markdown;
        }

        document.getElementById("playbookBody")
            .innerHTML =
            marked.parse(markdown);

    } catch(error){

        document.getElementById("playbookBody")
            .innerHTML =
            "<h3>Error loading document</h3>";

    }
}

document
.getElementById("search")
.addEventListener("input",render);

document
.getElementById("clearFilters")
.addEventListener("click",() => {

    document.getElementById("search").value = "";

    render();

});

document
.getElementById("closeModal")
.addEventListener("click",() => {

    document.getElementById("modal")
        .style.display = "none";

});

window.addEventListener("click",(e)=>{

    if(e.target.id==="modal"){

        document.getElementById("modal")
            .style.display="none";

    }

});

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        document.getElementById("modal")
            .style.display="none";

    }

});

loadRepository();

</script>

</body>
</html>
